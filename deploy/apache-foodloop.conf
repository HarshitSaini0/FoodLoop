# /etc/apache2/sites-available/foodloop.conf
# Needs: sudo a2enmod proxy proxy_http headers
<VirtualHost *:80>
    ServerName foodloop.harshit-saini.duckdns.org

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/
    LimitRequestBody 6291456
</VirtualHost>
