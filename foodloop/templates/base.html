<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoodLoop prototype</title>
<style>
 :root{--ink:#14201a;--mute:#5a6b60;--line:#cfcabb;--paper:#f4f1e8;--amber:#e8a33d;--leaf:#2f7d52}
 body{font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper);margin:0}
 header{background:#12261e;color:#f4f1e8;padding:14px 24px;display:flex;gap:24px;align-items:center}
 header a{color:#f4f1e8;text-decoration:none} header strong{font-size:20px}
 main{max-width:860px;margin:24px auto;padding:0 20px}
 .banner{background:#fbefd8;border:1px solid var(--amber);border-radius:10px;padding:10px 14px;margin-bottom:20px;font-size:14px}
 .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
 label{display:block;margin:10px 0 4px;font-weight:600} input,select{padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;box-sizing:border-box}
 button{background:var(--leaf);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer;margin-top:12px}
 button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
 table{width:100%;border-collapse:collapse;font-size:14px} td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
 .err{background:#fde8e8;border:1px solid #d33;border-radius:8px;padding:8px 12px;margin-bottom:14px}
 .ok{color:var(--leaf);font-weight:600} .bad{color:#b00;font-weight:600}
 code{font-size:12px;word-break:break-all} img.photo{max-width:100%;border-radius:10px}
 .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:#eee;font-size:13px}
</style></head><body>
<header><strong>FoodLoop</strong><a href="/">New scan</a><a href="/batches">Batches</a><a href="/ledger">Ledger</a></header>
<main>
<div class="banner"><b>Prototype.</b> Trained on public data or a demo placeholder. Not validated for food safety. Never donate food based on this screen.</div>
{% block content %}{% endblock %}
</main></body></html>
